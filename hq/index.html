<style>
:root{color-scheme:dark;--navy:#102237;--navy2:#1B3047;--ink:#FBF8F1;--muted:#B7C1CE;--faint:#8E9AAA;--gold:#B89660;--gold2:#CFAF79;--line:#36495D;--bad:#F4A49A}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--navy)}
body{margin:0;min-height:100%;background:var(--navy);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:380px;display:grid;gap:16px}
.mark{width:60px;height:60px;border-radius:14px;display:block;box-shadow:0 0 0 1px var(--line)}
.eyebrow{margin:6px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:600}
h1{margin:-6px 0 0;font:700 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
form{display:grid;gap:12px;margin:6px 0 0}
.lbl{font-size:13px;color:var(--muted)}
.pw{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--navy2);color:var(--ink)}
.pw:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.rem{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);min-height:44px;cursor:pointer}
.rem input{width:20px;height:20px;margin:0;accent-color:var(--gold)}
.go{font:inherit;font-weight:600;font-size:16px;min-height:50px;border:0;border-radius:12px;background:var(--gold);color:#102237;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.go.alt{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.pwrow{position:relative}
.pwrow .pw{padding-right:74px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:14px;font-weight:600;color:var(--gold2);background:transparent;border:0;border-radius:8px;min-height:44px;min-width:60px;cursor:pointer}
.eye:focus-visible{outline:2px solid var(--gold);outline-offset:0}
.st{margin:0;min-height:1.5em;font-size:14.5px;color:var(--muted)}
.st.bad{color:var(--bad)}
.foot{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--faint)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

  if (!C || !window.isSecureContext || !window.TextEncoder) { stop("This browser can't unlock the page. Open it in Safari or Chrome."); return; }
  if (!(P.lock.iter >= 600000)) { stop('This page did not load fully. Reload it.'); return; }

  // "Remember" is offered only in the iPhone Home Screen app. Its storage is separate from Safari's, so pages
  // opened in Safari (including other pages on this site) never share it, and Lock clears the only copy.
  var homeApp = window.navigator.standalone === true;
  var iosTab = window.navigator.standalone === false;
  remRow.hidden = !homeApp;
  if (!homeApp) rem.checked = false;
  document.getElementById('fa').hidden = !homeApp;
  document.getElementById('fi').hidden = !iosTab;

  var eye = document.getElementById('e');
  eye.addEventListener('click', function(){
    var showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    eye.textContent = showing ? 'Show' : 'Hide';
    eye.setAttribute('aria-pressed', showing ? 'false' : 'true');
    inp.focus();
  });

  var te = new TextEncoder();
  function u8(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  // Same rule as setup-passphrase.mjs: lower case, and anything that is not a-z or 0-9 counts as one space.
  function norm(s){ return s.normalize('NFC').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  // Lock (and the idle lock) arrive here as ?locked=1 and also leave a lock flag ('1'), in case that address is lost.
  // A Remember save that failed leaves the flag 'save'. Any flag means: do not reopen from a remembered key; make
  // this app forget it, and read back to be sure. A remembered key also only reopens the guide when its "armed"
  // marker is present and this browser can still write and remove markers. The marker is used up here before the
  // guide opens, and the guide puts it back only when the app goes to the background (never on Lock).
  var TOMB = 'ritg-hq-locked', PING = 'ritg-hq-lockping', ARMED = 'ritg-hq-armed', DIR = location.pathname.replace(/[^/]*$/, '');
  function cookie(v, age, path){ try { document.cookie = TOMB + '=' + v + '; path=' + path + '; max-age=' + age + '; secure; samesite=strict'; } catch (e) {} }
  function tombSet(why){ try { localStorage.setItem(TOMB, why); } catch (e) {} cookie(why, 31536000, DIR); }
  function tombClear(){ try { localStorage.removeItem(TOMB); } catch (e) {} cookie('', 0, DIR); if (location.pathname !== DIR) cookie('', 0, location.pathname); }
  function tombRead(){
    var t = '';
    try { t = localStorage.getItem(TOMB) || ''; } catch (e) {}
    if (!t) { try { var m = ('; ' + document.cookie).match(/; ritg-hq-locked=([^;]*)/); t = m ? m[1] : ''; } catch (e) {} }
    return t;
  }
  function disarm(){ try { localStorage.removeItem(ARMED); } catch (e) {} }
  function armed(){ try { return localStorage.getItem(ARMED) === P.lock.salt; } catch (e) { return false; } }
  function unarmed(){ try { return localStorage.getItem(ARMED) === null; } catch (e) { return false; } }
  // Can this browser write a marker and remove it again right now?
  function writesWork(){
    var k = 'ritg-hq-probe';
    try {
      localStorage.setItem(k, '1');
      var ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok && localStorage.getItem(k) === null;
    } catch (e) { return false; }
  }
  var lockedNav = /(^|&)locked=1(&|$)/.test(location.search.slice(1));
  // ?locked=1 stays in the address until forgetting is confirmed, so a reload in between is still a Lock.
  function cleanUrl(){ if (lockedNav) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} } }
  // Another window of this site may press Lock while this one is still opening from a remembered key.
  var lockedMeanwhile = false, shellChan = null;
  try { shellChan = new BroadcastChannel('ritg-hq'); shellChan.onmessage = function(e){ if (e.data === 'lock') lockedMeanwhile = true; }; } catch (e) {}
  window.addEventListener('storage', function(e){ if ((e.key === TOMB || e.key === PING) && e.newValue) lockedMeanwhile = true; });

  // The remembered key is a non-extractable CryptoKey in IndexedDB (never the passphrase). Every use is one
  // transaction with a deadline: IndexedDB can hang, and after the deadline the transaction is aborted, or never
  // started if the database only opens later, so a slow write cannot land after we stopped waiting for it.
  var DB = 'ritg-hq', OS = 'keys';
  function withStore(mode, fn, ms){
    return new Promise(function(res, rej){
      var dead = false, db = null, tx = null, r;
      function end(ok, v){ if (dead) return; dead = true; clearTimeout(timer); try { if (db) db.close(); } catch (e) {} if (ok) res(v); else rej(v); }
      var timer = setTimeout(function(){ try { if (tx) tx.abort(); } catch (e) {} end(false, new Error('timeout')); }, ms);
      try { r = indexedDB.open(DB, 1); } catch (e) { end(false, e); return; }
      r.onupgradeneeded = function(){ try { r.result.createObjectStore(OS); } catch (e) {} };
      r.onerror = function(){ end(false, r.error); };
      r.onsuccess = function(){
        db = r.result;
        db.onversionchange = function(){ try { db.close(); } catch (e) {} };
        if (dead) { try { db.close(); } catch (e) {} return; }
        var q;
        try { tx = db.transaction(OS, mode); q = fn(tx.objectStore(OS)); } catch (e) { end(false, e); return; }
        tx.oncomplete = function(){ end(true, q && q.result); };
        tx.onerror = tx.onabort = function(){ end(false, tx.error || new Error('aborted')); };
      };
    });
  }
  function forgetConfirmed(){
    return withStore('readwrite', function(s){ return s.delete('k'); }, 3000)
      .then(function(){ return withStore('readonly', function(s){ return s.get('k'); }, 3000); })
      .then(function(rec){ if (rec !== undefined) throw new Error('still saved'); });
  }

  function openPage(key){
    return C.decrypt({ name: 'AES-GCM', iv: u8(P.data.iv), additionalData: te.encode(P.data.aad) }, key, u8(P.data.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function show(html, remembered){
    try { if (shellChan) shellChan.close(); } catch (e) {}
    cleanUrl();
    window.ritgHqAuto = remembered === true;
    window.ritgHqArm = remembered === true ? P.lock.salt : '';
    window.ritgHqSalt = P.lock.salt;
    document.open(); document.write(html); document.close();
  }
  // In the Home Screen app the guide opens only once no marker is left (a marker this phone cannot remove would let
  // the saved key reopen the guide after a later Lock), or once the saved key is confirmed gone.
  function safeToShow(){
    if (!homeApp) return Promise.resolve(true);
    disarm();
    if (unarmed()) return Promise.resolve(true);
    return forgetConfirmed().then(function(){ return true; }, function(){ return false; });
  }
  var NO_DATA = "This phone isn't letting the page save or clear its data right now, so the Home Screen app can't open the guide safely. Open it in Safari instead, or try again later.";
  var NO_DATA_BLOCKED = "This phone is set to block website data for this app, so the Home Screen app can't open the guide safely. Open it in Safari instead.";
  function blocked(){ try { localStorage.getItem(ARMED); return false; } catch (e) { return true; } }
  async function unwrap(pass){
    var base = await C.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var wk = await C.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.lock.salt), iterations: P.lock.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var raw = new Uint8Array(await C.decrypt({ name: 'AES-GCM', iv: u8(P.lock.iv), additionalData: te.encode(P.lock.aad) }, wk, u8(P.lock.ct)));
    try { return await C.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']); } finally { raw.fill(0); }
  }

  var busy = false, fails = 0;
  function ready(){ busy = false; btn.disabled = false; }
  function hold(){ busy = true; btn.disabled = true; }
  var LOCKED_BUT = 'Locked, but this app may still remember the key. Tap Try again.';

  // Make this app forget its key. mode 'lock': Lock was pressed (or one never finished here), so say how it went
  // and offer Try again. 'save': a Remember save failed last time. '': quietly. Until forgetting is confirmed the
  // flag stays, so the key is never used to reopen the guide.
  function forgetNow(mode){
    hold(); retry.hidden = true; disarm();
    if (mode === 'lock' && !homeApp) say('Locked.');
    return forgetConfirmed().then(function(){
      tombClear(); cleanUrl(); ready();
      if (mode === 'lock' && homeApp) say('Locked. This app no longer remembers the key.');
      if (mode === 'save') say('This phone could not remember the key last time. Tick Remember to try again.');
    }, function(){
      ready();
      if (mode === '' || !homeApp) { if (mode !== '') cleanUrl(); return; }
      tombSet(mode === 'save' ? 'save' : '1');
      say(LOCKED_BUT, true);
      retry.hidden = false;
    });
  }
  retry.addEventListener('click', function(){ if (busy) return; say('Trying again…'); forgetNow('lock'); });

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    if (busy) return;
    var pass = norm(inp.value);
    if (!pass) { inp.focus(); return; }
    // The Home Screen app keeps the guide on screen only while it can clear the "armed" marker, so with website data
    // blocked it says so now instead of opening the guide and closing it again.
    if (homeApp && blocked()) { retry.hidden = true; say(NO_DATA_BLOCKED, true); return; }
    hold(); retry.hidden = true; say('Opening…');
    var key, html, kept = false;
    try { key = await unwrap(pass); }
    catch (e) {
      ready(); fails++;
      say("That passphrase didn't open it. Check it and try again." + (fails > 1 ? ' If it was changed in the last 10 minutes, wait a few minutes and reload.' : ''), true);
      inp.focus(); inp.select(); return;
    }
    try { html = await openPage(key); }
    catch (e) { ready(); say('The page did not open. Reload and try again.', true); return; }
    pass = '';
    if (homeApp && rem.checked && window.indexedDB) {
      // Saved only if the key is written in time and this browser can write and remove the marker (which the guide
      // sets when the app goes to the background). Otherwise it counts as not saved: the flag makes the next start
      // forget any copy that lands late, and nothing reopens without the marker anyway.
      try { await withStore('readwrite', function(s){ return s.put({ salt: P.lock.salt, key: key }, 'k'); }, 2500); kept = writesWork(); } catch (e) { kept = false; }
      if (kept) { tombClear(); } else { disarm(); tombSet('save'); forgetConfirmed().catch(function(){}); }
    }
    inp.value = '';
    if (!(await safeToShow())) { ready(); say(blocked() ? NO_DATA_BLOCKED : NO_DATA, true); return; }
    show(html, kept);
  });

  var tomb = tombRead();
  if (!window.indexedDB) {
    // Nothing can be checked or forgotten without IndexedDB, so the flag stays for a later start.
    if (lockedNav || tomb) { if (homeApp) { say(LOCKED_BUT, true); retry.hidden = false; } else if (lockedNav) say('Locked.'); }
  }
  else if (lockedNav || tomb) { forgetNow(lockedNav ? 'lock' : tomb === 'save' ? 'save' : (homeApp ? 'lock' : '')); }
  else if (!homeApp) { disarm(); forgetConfirmed().catch(function(){}); }
  else if (!armed() || !writesWork()) { forgetNow(''); }
  else {
    // A remembered key reopens the guide only inside the Home Screen app, with no lock flag and with its marker,
    // and only once the marker is confirmed used up (so the guide is never on screen while a marker exists).
    disarm();
    if (!unarmed()) { forgetNow(''); }
    else {
      hold();
      withStore('readonly', function(s){ return s.get('k'); }, 2500).then(function(rec){
        if (!rec || !rec.key) { ready(); return; }
        if (rec.salt !== P.lock.salt) { forgetNow(''); return; }
        say('Opening…');
        return openPage(rec.key).then(function(html){
          if (lockedMeanwhile || tombRead()) { forgetNow('lock'); return; }
          if (!unarmed()) { say(''); forgetNow(''); return; }
          show(html, true);
        }, function(){ say(''); forgetNow(''); });
      }, function(){ ready(); });
    }
  }
})();</script>
