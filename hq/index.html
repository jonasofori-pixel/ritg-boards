<style>
:root{color-scheme:dark;--navy:#102237;--navy2:#1B3047;--ink:#FBF8F1;--muted:#B7C1CE;--faint:#8E9AAA;--gold:#B89660;--gold2:#CFAF79;--line:#36495D;--bad:#F4A49A}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--navy)}
body{margin:0;min-height:100%;background:var(--navy);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:380px;display:grid;gap:16px}
.mark{width:60px;height:60px;border-radius:14px;display:block;box-shadow:0 0 0 1px var(--line)}
.eyebrow{margin:6px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:600}
h1{margin:-6px 0 0;font:700 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
form{display:grid;gap:12px;margin:6px 0 0}
.lbl{font-size:13px;color:var(--muted)}
.pw{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--navy2);color:var(--ink)}
.pw:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.rem{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);min-height:44px;cursor:pointer}
.rem input{width:20px;height:20px;margin:0;accent-color:var(--gold)}
.go{font:inherit;font-weight:600;font-size:16px;min-height:50px;border:0;border-radius:12px;background:var(--gold);color:#102237;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pwrow{position:relative}
.pwrow .pw{padding-right:74px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:14px;font-weight:600;color:var(--gold2);background:transparent;border:0;border-radius:8px;min-height:44px;min-width:60px;cursor:pointer}
.eye:focus-visible{outline:2px solid var(--gold);outline-offset:0}
.st{margin:0;min-height:1.5em;font-size:14.5px;color:var(--muted)}
.st.bad{color:var(--bad)}
.foot{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--faint)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

<script>(function(){
  'use strict';
  var st = document.getElementById('s');
  function say(t, bad){ st.textContent = t; st.className = bad ? 'st bad' : 'st'; }
  var form = document.getElementById('f'), inp = document.getElementById('p'), rem = document.getElementById('r'), remRow = document.getElementById('rr'), btn = document.getElementById('b');
  function stop(msg){ say(msg, true); btn.disabled = true; inp.disabled = true; rem.disabled = true; }
  if (window.top !== window.self) { stop('Open this page directly, not inside another site.'); return; }
  var P;
  try { P = JSON.parse(document.getElementById('payload').textContent); } catch (e) { stop('This page did not load fully. Reload it.'); return; }
  var C = window.crypto && window.crypto.subtle;
  if (!C || !window.isSecureContext || !window.TextEncoder) { stop("This browser can't unlock the page. Open it in Safari or Chrome."); return; }
  if (!(P.lock.iter >= 600000)) { stop('This page did not load fully. Reload it.'); return; }

  // "Remember" is offered only in the iPhone Home Screen app. Its storage is separate from Safari's, so pages
  // opened in Safari (including other pages on this site) never share it, and Lock clears the only copy.
  var homeApp = window.navigator.standalone === true;
  var iosTab = window.navigator.standalone === false;
  remRow.hidden = !homeApp;
  if (!homeApp) rem.checked = false;
  document.getElementById('fa').hidden = !homeApp;
  document.getElementById('fi').hidden = !iosTab;

  var eye = document.getElementById('e');
  eye.addEventListener('click', function(){
    var showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    eye.textContent = showing ? 'Show' : 'Hide';
    eye.setAttribute('aria-pressed', showing ? 'false' : 'true');
    inp.focus();
  });

  var te = new TextEncoder();
  function u8(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  // Same rule as setup-passphrase.mjs: lower case, and anything that is not a-z or 0-9 counts as one space.
  function norm(s){ return s.normalize('NFC').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  // IndexedDB can hang in some browsers; never let it block typing the passphrase.
  function within(ms, p){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]); }

  // The remembered key is a non-extractable CryptoKey in IndexedDB (never the passphrase).
  var DB = 'ritg-hq', OS = 'keys';
  function withStore(mode, fn){
    return new Promise(function(res, rej){
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(OS); };
      r.onerror = function(){ rej(r.error); };
      r.onsuccess = function(){
        var db = r.result, tx, q;
        try { tx = db.transaction(OS, mode); q = fn(tx.objectStore(OS)); } catch (e) { db.close(); rej(e); return; }
        tx.oncomplete = function(){ db.close(); res(q && q.result); };
        tx.onerror = tx.onabort = function(){ db.close(); rej(tx.error); };
      };
    });
  }
  function forget(){ try { indexedDB.deleteDatabase(DB); } catch (e) {} }

  function openPage(key){
    return C.decrypt({ name: 'AES-GCM', iv: u8(P.data.iv), additionalData: te.encode(P.data.aad) }, key, u8(P.data.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function show(html, remembered){ window.ritgHqAuto = remembered === true; document.open(); document.write(html); document.close(); }
  async function unwrap(pass){
    var base = await C.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var wk = await C.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.lock.salt), iterations: P.lock.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var raw = new Uint8Array(await C.decrypt({ name: 'AES-GCM', iv: u8(P.lock.iv), additionalData: te.encode(P.lock.aad) }, wk, u8(P.lock.ct)));
    try { return await C.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']); } finally { raw.fill(0); }
  }

  var busy = false, fails = 0;
  function ready(){ busy = false; btn.disabled = false; }
  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    if (busy) return;
    var pass = norm(inp.value);
    if (!pass) { inp.focus(); return; }
    busy = true; btn.disabled = true; say('Opening…');
    var key, html, kept = false;
    try { key = await unwrap(pass); }
    catch (e) {
      ready(); fails++;
      say("That passphrase didn't open it. Check it and try again." + (fails > 1 ? ' If it was changed in the last 10 minutes, wait a few minutes and reload.' : ''), true);
      inp.focus(); inp.select(); return;
    }
    try { html = await openPage(key); }
    catch (e) { ready(); say('The page did not open. Reload and try again.', true); return; }
    pass = '';
    if (homeApp && rem.checked && window.indexedDB) {
      try { await within(2500, withStore('readwrite', function(s){ return s.put({ salt: P.lock.salt, key: key }, 'k'); })); kept = true; } catch (e) {}
    }
    inp.value = '';
    show(html, kept);
  });

  // A remembered key is used only inside the Home Screen app; anywhere else any stored key is cleared.
  if (window.indexedDB && !homeApp) { forget(); }
  else if (window.indexedDB) {
    busy = true;
    within(2500, withStore('readonly', function(s){ return s.get('k'); })).then(function(rec){
      if (!rec || !rec.key) { ready(); return; }
      if (rec.salt !== P.lock.salt) { forget(); ready(); return; }
      say('Opening…');
      return openPage(rec.key).then(function(html){ show(html, true); }, function(){ forget(); ready(); say(''); });
    }, function(){ ready(); });
  }
})();</script>
