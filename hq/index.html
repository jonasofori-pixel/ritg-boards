<style>
:root{color-scheme:dark;--navy:#102237;--navy2:#1B3047;--ink:#FBF8F1;--muted:#B7C1CE;--faint:#8E9AAA;--gold:#B89660;--gold2:#CFAF79;--line:#36495D;--bad:#F4A49A}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--navy)}
body{margin:0;min-height:100%;background:var(--navy);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:380px;display:grid;gap:16px}
.mark{width:60px;height:60px;border-radius:14px;display:block;box-shadow:0 0 0 1px var(--line)}
.eyebrow{margin:6px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:600}
h1{margin:-6px 0 0;font:700 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
form{display:grid;gap:12px;margin:6px 0 0}
.lbl{font-size:13px;color:var(--muted)}
.pw{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--navy2);color:var(--ink)}
.pw:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.rem{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);min-height:44px;cursor:pointer}
.rem input{width:20px;height:20px;margin:0;accent-color:var(--gold)}
.go{font:inherit;font-weight:600;font-size:16px;min-height:50px;border:0;border-radius:12px;background:var(--gold);color:#102237;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.go.alt{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.pwrow{position:relative}
.pwrow .pw{padding-right:74px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:14px;font-weight:600;color:var(--gold2);background:transparent;border:0;border-radius:8px;min-height:44px;min-width:60px;cursor:pointer}
.eye:focus-visible{outline:2px solid var(--gold);outline-offset:0}
.st{margin:0;min-height:1.5em;font-size:14.5px;color:var(--muted)}
.st.bad{color:var(--bad)}
.foot{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--faint)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

<script>(function(){

    var t = '';
    try { t = localStorage.getItem(TOMB) || ''; } catch (e) {}

  }

    catch (e) {
      ready(); fails++;
      say("That passphrase didn't open it. Check it and try again." + (fails > 1 ? ' If it was changed in the last 10 minutes, wait a few minutes and reload.' : ''), true);
      inp.focus(); inp.select(); return;
    }
    try { html = await openPage(key); }
    catch (e) { ready(); say('The page did not open. Reload and try again.', true); return; }
    pass = '';
    if (homeApp && rem.checked && window.indexedDB) {
      // Saved only if the key is written in time and this browser can write and remove the marker (which the guide
      // sets when the app goes to the background). Otherwise it counts as not saved: the flag makes the next start
      // forget any copy that lands late, and nothing reopens without the marker anyway.
      try { await withStore('readwrite', function(s){ return s.put({ salt: P.lock.salt, key: key }, 'k'); }, 2500); kept = writesWork(); } catch (e) { kept = false; }
      if (kept) { tombClear(); } else { disarm(); tombSet('save'); forgetConfirmed().catch(function(){}); }
    }
    inp.value = '';
    if (!(await safeToShow())) { ready(); say(blocked() ? NO_DATA_BLOCKED : NO_DATA, true); return; }
    show(html, kept);
  });

  var tomb = tombRead();
  if (!window.indexedDB) {
    // Nothing can be checked or forgotten without IndexedDB, so the flag stays for a later start.
    if (lockedNav || tomb) { if (homeApp) { say(LOCKED_BUT, true); retry.hidden = false; } else if (lockedNav) say('Locked.'); }
  }
  else if (lockedNav || tomb) { forgetNow(lockedNav ? 'lock' : tomb === 'save' ? 'save' : (homeApp ? 'lock' : '')); }
  else if (!homeApp) { disarm(); forgetConfirmed().catch(function(){}); }
  else if (!armed() || !writesWork()) { forgetNow(''); }
  else {
    // A remembered key reopens the guide only inside the Home Screen app, with no lock flag and with its marker,
    // and only once the marker is confirmed used up (so the guide is never on screen while a marker exists).
    disarm();
    if (!unarmed()) { forgetNow(''); }
    else {
      hold();
      withStore('readonly', function(s){ return s.get('k'); }, 2500).then(function(rec){
        if (!rec || !rec.key) { ready(); return; }
        if (rec.salt !== P.lock.salt) { forgetNow(''); return; }
        say('Opening…');
        return openPage(rec.key).then(function(html){
          if (lockedMeanwhile || tombRead()) { forgetNow('lock'); return; }
          if (!unarmed()) { say(''); forgetNow(''); return; }
          show(html, true);
        }, function(){ say(''); forgetNow(''); });
      }, function(){ ready(); });
    }
  }
})();</script>
</body>
</html>
